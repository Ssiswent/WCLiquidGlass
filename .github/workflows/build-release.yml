name: Build and Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: Build arm64 package
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^Version:[[:space:]]*//p' control)"
          scripts/release-version.sh --validate-tag "$package_version" "$GITHUB_REF_NAME"
          scripts/release-notes.sh "$package_version" >/dev/null
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "Release tag $GITHUB_REF_NAME points to $tag_commit, expected $GITHUB_SHA." >&2
            exit 77
          fi

      - name: Install Theos and iPhoneOS SDK link
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid
          export THEOS="$RUNNER_TEMP/theos"
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$THEOS"
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-platform-version)"
          ln -s "$sdk_path" "$THEOS/sdks/iPhoneOS${sdk_version}.sdk"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          xcodebuild -version

      - name: Build rootless arm64 deb
        shell: bash
        run: make clean package FINALPACKAGE=1

      - name: Verify rootless arm64 deb
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_files=(packages/*.deb)
          if [ "${#package_files[@]}" -ne 1 ]; then
            echo "Expected exactly one package, found ${#package_files[@]}." >&2
            exit 78
          fi
          scripts/verify-project.sh "${package_files[0]}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: WCLiquidGlass-${{ github.ref_name }}-arm64
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$GITHUB_REF_NAME"
          package_version="$(sed -n 's/^Version:[[:space:]]*//p' control)"
          scripts/release-version.sh --validate-tag "$package_version" "$release_tag"
          release_notes_file="$(mktemp)"
          trap 'rm -f "$release_notes_file"' EXIT
          scripts/release-notes.sh "$package_version" > "$release_notes_file"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; refusing to replace assets." >&2
            exit 79
          fi
          gh release create "$release_tag" packages/*.deb --target "$GITHUB_SHA" --title "WCLiquidGlass $package_version" --notes-file "$release_notes_file" --latest
