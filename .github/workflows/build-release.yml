name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：填写与 control 映射一致的 tag，例如 1.8.2~beta.1 对应 v1.8.2-beta.1"
        required: false
        type: string
      release_notes:
        description: "可选：本次中文变更说明；留空时读取 CHANGELOG.md 对应版本"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build arm64 package
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Theos and iPhoneOS SDK link
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid
          export THEOS="$RUNNER_TEMP/theos"
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$THEOS"
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-platform-version)"
          ln -s "$sdk_path" "$THEOS/sdks/iPhoneOS${sdk_version}.sdk"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          xcodebuild -version

      - name: Build rootless arm64 deb
        shell: bash
        run: make clean package FINALPACKAGE=1 WCLIQUIDGLASS_AUTO_BUMP=0

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: WCLiquidGlass-${{ github.ref_name }}-arm64
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME}}"
          package_version="$(sed -n 's/^Version:[[:space:]]*//p' control)"
          scripts/release-version.sh --validate-tag "$package_version" "$release_tag"
          release_channel="$(scripts/release-version.sh --channel "$package_version")"

          release_notes_file="$(mktemp)"
          trap 'rm -f "$release_notes_file"' EXIT
          if [ -n "${INPUT_RELEASE_NOTES:-}" ]; then
            printf '%s\n' "$INPUT_RELEASE_NOTES" > "$release_notes_file"
          else
            scripts/release-notes.sh "$package_version" > "$release_notes_file"
          fi
          if ! grep -q '[^[:space:]]' "$release_notes_file"; then
            echo "Release notes are required. Add CHANGELOG.md entry for $package_version or provide release_notes." >&2
            exit 65
          fi

          release_title="WCLiquidGlass $package_version"
          release_state=()
          if [ "$release_channel" = "prerelease" ]; then
            release_state=(--prerelease)
          else
            release_state=(--latest)
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" packages/*.deb --clobber
            gh release edit "$release_tag" --title "$release_title" --notes-file "$release_notes_file" "${release_state[@]}"
          else
            gh release create "$release_tag" packages/*.deb --target "$GITHUB_SHA" --title "$release_title" --notes-file "$release_notes_file" "${release_state[@]}"
          fi
